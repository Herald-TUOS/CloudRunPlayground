steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/pvlive/github.com/herald-tuos/cloudrunplayground:$SHORT_SHA', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/pvlive/github.com/herald-tuos/cloudrunplayground:$SHORT_SHA']

# Option 1: Use Cloud Logging only (recommended)
options:
  logging: CLOUD_LOGGING_ONLY

images:
  - 'gcr.io/pvlive/github.com/herald-tuos/cloudrunplayground:$SHORT_SHA'